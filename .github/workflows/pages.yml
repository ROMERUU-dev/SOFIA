# Publishes the web version (web/ + the Python package for Pyodide) on GitHub Pages.
name: Pagina web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "resources/models/**"
      - "tests/**"
      - "scripts/build_web.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pruebas
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Armar el sitio
        run: python scripts/build_web.py --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
